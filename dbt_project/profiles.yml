running_tracker:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{env_var('WAREHOUSE_HOST', 'warehouse-db')}}"
      port: "{{env_var('WAREHOUSE_PORT', '5432') | as_number}}"
      user: "{{env_var('WAREHOUSE_USER')}}"
      password: "{{env_var('WAREHOUSE_PASSWORD')}}"
      database: "{{env_var('WAREHOUSE_DB')}}"
      schema: staging
      threads: 2
