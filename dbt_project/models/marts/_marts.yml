version: 2

models:
  - name: fct_runs
    description: "Satu baris per lari (Run/TrailRun) dengan jarak dalam km dan pace."
    columns:
      - name: activity_id
        tests:
          - unique
          - not_null
      - name: sport_type
        tests:
          - accepted_values:
              arguments:
                values: ["Run", "TrailRun", "Walk"]
      - name: distance_km
        tests:
          - not_null
      - name: pace_min_per_km
        tests:
          - not_null

  - name: weekly_summary
    description: "Ringkasan lari per minggu (Senin sebagai awal minggu)."
    columns:
      - name: week_start
        tests:
          - unique
          - not_null

  - name: personal_records
    description: "Pace tercepat per kelompok jarak (5K, 10K, Half Marathon, Marathon)."
    columns:
      - name: distance_bucket
        tests:
          - unique
          - not_null